name: Deploy Core apps - user-app, propayn-gateway and bank-simulator
on:
  push:
    branches: [ production ]


jobs:
  redeploy_core:
    runs-on: ubuntu-latest
    name: Redeploy user, propayn-gateway, bank-simulator
    steps:
      - run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROPAYN_SSH_KEY }}" > ~/.ssh/propayn_key
          chmod 600 ~/.ssh/propayn_key
          echo "${{ secrets.KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/propayn_key ubuntu@${{ secrets.PROPAYN_HOST_IP }} -t "export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          [ -s "$NVM_DIR/bash_completion" ] && \. "$NVM_DIR/bash_completion" && cd proPAYn_app && git pull origin production && npm run db:migrate && npm run db:generate && npm install && npm run build && pm2 reload ecosystem.config.js"
          echo "Deployment complete!"