name: Deploy Core apps - user-app, propayn-gateway and bank-simulator
on:
  push:
    branches: [ main ]


jobs:
  redeploy_core:
    runs-on: ubuntu-latest
    name: Redeploy user, propayn-gateway, bank-simulator
    steps:
      - run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROPAYN_SSH_KEY }}" > ~/.ssh/propayn_key
          chmod 600 ~/.ssh/propayn_key
          echo "${{ secrets.KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/propayn_key ubuntu@${{ secrets.PROPAYN_HOST_IP }} -t "export PATH=/home/ubuntu/.nvm/versions/node/v24.4.0/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/games:/usr/local/games:/snap/bin && cd proPAYn_app && git pull origin main && npm run db:migrate && npm run db:generate && npm install && npm run build && pm2 reload ecosystem.config.js"
          echo "Deployment complete!"